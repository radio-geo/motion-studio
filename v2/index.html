<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motion Studio 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/studio.css" />
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen" class="screen login">
  <div class="login-card">
    <div class="login-logo">Motion<span>Studio</span><span class="v2-badge">V2</span></div>
    <p class="login-sub" data-i18n="loginSub">Broadcast-quality motion graphics. Free, in your browser.</p>
    <form id="login-form" autocomplete="off">
      <label data-i18n="labelUser">User <input id="login-user" type="text" placeholder="user" /></label>
      <label data-i18n="labelPassword">Password <input id="login-pass" type="password" placeholder="123" /></label>
      <button type="submit" class="btn primary" data-i18n="signIn">Sign in</button>
      <p id="login-error" class="login-error" hidden data-i18n="loginError">Wrong user or password.</p>
    </form>
    <div class="login-dormant">
      <button class="btn ghost" disabled title="Coming later" data-i18n="continueGoogle">Continue with Google</button>
      <button class="btn ghost" disabled title="Coming later" data-i18n="emailSignIn">Email sign-in</button>
      <span class="tag-later" data-i18n="scaffoldedDormant">scaffolded, dormant</span>
    </div>
    <div class="login-v1"><a href="/" data-i18n="openV1">open V1</a></div>
  </div>
</div>

<!-- ============ STUDIO ============ -->
<div id="studio-screen" class="screen studio" hidden>
  <header class="topbar">
    <div class="brand">Motion<span>Studio</span><span class="v2-badge">V2</span></div>
    <nav class="template-tabs" id="template-tabs"></nav>
    <div class="topbar-right">
      <div class="seg lang-toggle" id="lang-toggle">
        <button data-lang="en">EN</button>
        <button data-lang="ge">GE</button>
      </div>
      <span id="active-user" class="who"></span>
      <button id="logout-btn" class="btn ghost small" data-i18n="signOut">Sign out</button>
    </div>
  </header>

  <main class="workspace">
    <!-- LEFT: content -->
    <section class="panel editor" id="editor-panel"></section>

    <!-- CENTER: stage -->
    <section class="stage-wrap">
      <div class="stage-toolbar">
        <div class="seg" id="aspect-seg">
          <button data-aspect="16:9" class="active">16:9</button>
          <button data-aspect="9:16">9:16</button>
        </div>
        <div class="seg" id="fps-seg">
          <button data-fps="25" class="active">25 fps</button>
          <button data-fps="50">50 fps</button>
        </div>
        <div class="dur-control" id="dur-control">
          <input type="text" id="dur-input" class="dur-input" value="5" title="Duration: seconds or mm:ss" />
          <div class="dur-presets" id="dur-presets">
            <button data-dur="5">5s</button>
            <button data-dur="15">15s</button>
            <button data-dur="30">30s</button>
            <button data-dur="60">1m</button>
            <button data-dur="120">2m</button>
          </div>
        </div>
        <button id="guides-btn" class="btn ghost small" data-i18n="guides">Guides</button>
        <div class="transport">
          <button id="play-btn" class="btn small" data-i18n="play">Play</button>
          <button id="restart-btn" class="btn ghost small" data-i18n="restart">Restart</button>
          <button id="loop-btn" class="btn ghost small active" data-i18n="loop">↩ Loop</button>
        </div>
        <span class="kbd-hint" data-i18n="kbdHint">Space · R · ←→</span>
      </div>

      <div class="stage-frame" id="stage-frame">
        <div class="canvas-stack" id="canvas-stack">
          <canvas id="stage-canvas" width="1920" height="1080"></canvas>
          <canvas id="overlay-canvas" width="1920" height="1080"></canvas>
        </div>
      </div>

      <div class="scrubber">
        <input id="scrub" type="range" min="0" max="1000" value="0" />
        <span id="time-display" class="time-display">0.0 / 5.0</span>
      </div>
    </section>

    <!-- RIGHT: inspector + global sections -->
    <aside class="panel side">
      <div class="side-section" id="inspector-panel"></div>
      <div class="side-section" id="motion-panel"></div>
      <div class="side-section" id="brandkit-panel"></div>
      <div class="side-section" id="export-panel"></div>
      <div class="side-section" id="project-panel"></div>
    </aside>
  </main>
</div>

<!-- vendor -->
<script src="js/vendor/mp4-muxer.js"></script>
<script src="js/vendor/webm-muxer.js"></script>
<!-- core -->
<script src="js/core/timeline.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/brandkit.js"></script>
<script src="js/core/textselect.js"></script>
<script src="js/core/stage.js"></script>
<script src="js/core/exporter.js"></script>
<script src="js/core/project.js"></script>
<!-- templates -->
<script src="js/templates/quote.js"></script>
<script src="js/templates/social.js"></script>
<script src="js/templates/slideshow.js"></script>
<script src="js/templates/press.js"></script>
<!-- shell -->
<script src="js/app.js"></script>
</body>
</html>
